generations:
  - name: "First Generation"
    start_year: 2017
    end_year: 2020
    description: "The original Genesis G70 debuted on September 15, 2017, at the global launch event in Seoul. It was designed as the brand's entry-level luxury sport sedan to compete with the BMW 3 Series and Mercedes-Benz C-Class, built on the Hyundai M2 platform (shared with the Kia Stinger). The pre-facelift G70 featured distinctive styling under Genesis's 'Athletic Elegance' design philosophy with LED headlights and athletic rear styling. It was available with a 2.0L turbocharged four-cylinder producing 252 HP, a 3.3L twin-turbocharged V6 delivering 365-370 HP, or a 2.2L turbodiesel with 199 HP. A six-speed manual transmission was available with the 2.0L engine, with most models featuring an eight-speed automatic. The G70 received critical acclaim for its driving dynamics, value proposition, and refinement, winning the 2019 North American Car of the Year award. The pre-facelift generation offered both rear-wheel and all-wheel drive configurations with premium interior materials and driver-focused layout."

  - name: "First Generation (Facelift)"
    start_year: 2020
    end_year: null
    description: "A comprehensive facelift was announced on September 8, 2020, going on sale in South Korea on October 20, 2020, and as a 2022 model year in North America. The facelift incorporated new corporate design cues from the Genesis GV80 crossover and second-generation G80 sedan, featuring new front and rear bumpers, headlights (adopting quad headlights), taillights, and a new grille design. While sharing the same fundamental M2 platform as the pre-facelift model, the updated design received mixed reactions, particularly in Korea where some criticized the new taillights. The facelift featured a new optional 10.25-inch touchscreen infotainment system and digital instrument cluster options. Powertrain options continued with the 2.0L turbocharged four-cylinder and 3.3L twin-turbocharged V6. In 2023, the 2.0L was upgraded to a 2.5L turbocharged Smartstream engine producing 304 HP. The manual transmission was discontinued starting with the 2022 model year. A shooting brake (station wagon) variant was introduced in May 2021 for European markets. Advanced driver assistance systems were expanded with Highway Driving Assist II with machine learning capabilities."
